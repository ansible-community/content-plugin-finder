[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-plugin-finder"
version = "0.1.0"
description = "Find Ansible modules, filters, and lookups used in scenario/target directories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ansible Community" }]
dependencies = [
  "PyYAML",
  "ruamel.yaml",
  "jsonpickle",
  "joblib",
  "requests",
  "filelock",
  "rapidfuzz",
  "tabulate",
  "gitdb",
  "smmap",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.9.0",
]

[project.scripts]
content-plugin-finder = "content_plugin_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ansible_content_capture = [
  "*.json",
  "*.txt",
]

[tool.ruff]
extend-exclude = [
  "src/ansible_content_capture",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
